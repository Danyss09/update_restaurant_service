name: Deploy to AWS

on:
  push:
    branches:
      - test  # Se ejecutará solo cuando hagas push a la rama 'test'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v2

      - name: Login en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir y subir imagen a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/update_restaurant_service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/update_restaurant_service:latest

      - name: Conectar a AWS EC2 y desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user
            sudo docker stop update_restaurant_service || true
            sudo docker rm update_restaurant_service || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/update_restaurant_service:latest
            sudo docker run -d --restart always \
              --env-file /home/ec2-user/update_restaurant_service/.env \
              -p 3000:3000 \
              --name update_restaurant_service \
              ${{ secrets.DOCKER_USERNAME }}/update_restaurant_service:latest

